name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every plugin's client half is plain JS served as-is; a syntax error there
  # takes the whole sidebar down, so it is checked for all plugins first.
  client-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check every client bundle
        run: |
          set -e
          shopt -s globstar nullglob
          files=(plugins/*/client/*.js plugins/*/client.js)
          for f in "${files[@]}"; do
            echo "checking $f"
            node --check "$f"
          done
      # node --check is per file; the host CONCATENATES bundles into one combo
      # script ("??a/client.js,b/client.js,…"), so two plugins declaring the same
      # top-level name break web boot with
      # "Identifier 'NS' has already been declared". scripts/check-client-combo.mjs
      # compiles the concatenation — the point where that early error surfaces —
      # and additionally requires this repo's own bundles to be IIFE-wrapped.
      - name: Concatenated client bundle compiles in one scope (combo guard)
        run: node scripts/check-client-combo.mjs

  # dsh-sidebar-pins: behaviour suite + adversarial probes. The suites render the
  # real component with a real React, which the plugin does not ship, so React is
  # installed here (test-only) and pointed at with DSH_REACT_HOME.
  sidebar-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only React
        run: |
          mkdir -p "$RUNNER_TEMP/reacthome"
          cd "$RUNNER_TEMP/reacthome"
          npm init -y >/dev/null
          npm install --no-audit --no-fund react@19 react-dom@19
      - name: Behaviour suite
        env:
          DSH_REACT_HOME: ${{ runner.temp }}/reacthome
        run: node plugins/dsh-sidebar-pins/_verify/render.test.mjs
      - name: Adversarial probes
        env:
          DSH_REACT_HOME: ${{ runner.temp }}/reacthome
        run: node plugins/dsh-sidebar-pins/_verify/review-probes.mjs

  # dsh-approval-notify: pure logic, no React, no dependencies. Its suite runs
  # the approval waterfall for real and asserts the plugin can never stall it.
  approval-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Behaviour suite
        run: node plugins/dsh-approval-notify/_verify/notify.test.mjs
      - name: Adversarial probes
        run: node plugins/dsh-approval-notify/_verify/review-probes.mjs

  # dsh-plugin-love builds and tests with its own devDependencies.
  love:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: plugins/dsh-plugin-love/pnpm-lock.yaml
      # pnpm 11 refuses dependency build scripts unless approved. This plugin
      # does not need esbuild's postinstall (the platform binary comes from the
      # optional dependency), so install with strict-dep-builds off instead of
      # failing the step; the build step below proves esbuild actually works.
      - name: Install
        working-directory: plugins/dsh-plugin-love
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Typecheck, tests, build
        working-directory: plugins/dsh-plugin-love
        run: pnpm run verify
